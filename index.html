<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cacodemon roller</title>
  </head>
  <body>
    <div class="wrap" x-data="cacodemon">
      <!-- Overlay of how many demons got rolled -->
      <template x-if="rollCount">
        <div id="roll-count-overlay">
          Powering <span x-text="rollCount"></span> demons
        </div>
      </template>

      <!-- Top bar -->
      <template x-if="true">
        <div>
          <header class="masthead">
            <h1>ACKS II Cacodemon Roller</h1>
            <div class="button-bar">
              <template x-if="!demon">
                <div class="inputs-container">
                  <button
                    type="button"
                    class="padded-input generate-btn"
                    @click="generate($refs.rankSelect.value, $refs.bodySelect.value)"
                  >
                    Summon
                  </button>
                  new
                  <select x-ref="rankSelect" class="padded-input">
                    <template x-for="(r, index) in rankOptions">
                      <option
                        :value="index"
                        x-text="r"
                        :selected="defaultRank===index"
                      ></option>
                    </template>
                  </select>
                  <span>with</span>
                  <div>
                    <select x-ref="bodySelect" class="padded-input">
                      <template x-for="b in bodyOptions">
                        <option :value="b" x-text="b"></option>
                      </template>
                    </select>
                    <span>body form</span>
                  </div>
                </div>
              </template>
              <template x-if="demon">
                <button class="padded-input" style="height:2rem" @click="discard()">
                  Back to registry
                </button>
              </template>
            </div>
          </header>
        </div>
      </template>

      <!-- Active demon what just got rolled -->
      <template x-if="demon">
        <article class="dossier stamp-in" data-card-id="id">
          <div class="dossier-header">
            <div class="dossier-toggle-btn">
              <span class="seal" x-text="getSeal()" :style="'background:' + getSealColour()">
              </span>
              <span class="header-text">
              <h2 class="dossier-name" x-text="demon.name">
              </h2>
              <div class="dossier-quickstats" x-html="getQuickStats()">
              </div>
              </span>
            </div>
            <button 
              class="roll-btn tooltip"
              type="button" 
              data-tooltip="Re-roll name"
              aria-label="Re-roll name"
              @click="regenerateName()">
              ↻
            </button>
            <button 
              class="roll-btn tooltip"
              type="button" 
              data-tooltip="Edit name"
              aria-label="Edit name"
              @click="editName()">
              <i class="fa-solid fa-feather"></i>
            </button>
            <button 
              class="add-btn tooltip"
              type="button" 
              data-tooltip="Add to registry"
              aria-label="Add to registry"
              @click="addToRegister()">
              <i class="fa-solid fa-bookmark"></i>
            </button>
          </div>
          <div class="dossier-collapse expanded">
            <div class="dossier-collapse-inner">
              <div class="dossier-body">
                <div x-html="getDemonStatsHtml()">
                </div>
              </div>
            </div>
          </div>
        </article>
      </template>

      <!-- Registry of demons -->
      <template x-if="!demon">
        <div>
          <div style="display: grid; gap: 8px">
            <template x-for="demon in demons">
              <article class="dossier" data-card-id="demon.id">
                <div class="dossier-header">
                  <button class="dossier-toggle-btn" @click="toggleExpanded(demon.id)" type="button" data-id="id" aria-expanded="true" aria-label="Toggle details">
                    <span class="seal" x-text="getSeal()" :style="'background:' + getSealColour()">
                    </span>
                    <span class="header-text">
                    <h2 class="dossier-name" x-text="demon.name">
                    </h2>
                    <div class="dossier-quickstats" x-html="getQuickStats()">
                    </div>
                    </span>
                  </button>
                  <button 
                    class="roll-btn tooltip"
                    type="button" 
                    data-tooltip="Banish"
                    aria-label="Remove from register"
                    @click="removeFromRegister(demon)">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
                <template x-if="expandedIds.has(demon.id)">
                  <div class="dossier-collapse expanded">
                    <div class="dossier-collapse-inner">
                      <div class="dossier-body">
                        <div x-html="getDemonStatsHtml()">
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </article>
            </template>
          </div>
          <template x-if="demons.length == 0">
            <div class="empty-state"> 
              <p>The ledger stands empty.</p>
              <p>File your first specimen using the controls above.</p>
            </div>
          </template>
        </div>
      </template>

      <!-- Footnote -->
      <template x-if="true">
        <footer class="foot-note">
          <p x-text="storageMessage">
          </p>
        </footer>
      </template>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
